name: Validate

on:
  push:
    branches: [test, develop]
  pull_request:
    branches: [test]

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax
        timeout-minutes: 1

      - name: Run Jest tests
        run: npm test
        timeout-minutes: 2

      - name: Generate coverage report
        run: npm run test:coverage
        timeout-minutes: 2

      - name: Lint production logs
        run: npm run lint:logs
        timeout-minutes: 1

      - name: Lint Chrome Extension API calls
        run: npm run lint:api
        timeout-minutes: 1
        if: always()

      - name: Run full validation
        run: node scripts/validate.js
        timeout-minutes: 2

  scheduler:
    name: Scheduler Analysis
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scheduler
        run: node scripts/scheduler/run-all.js
        timeout-minutes: 5
        continue-on-error: true

      - name: Run agent analysis
        run: node scripts/scheduler/analyze-results.js
        timeout-minutes: 2
        if: always()
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-reports
          path: |
            scripts/scheduler/reports/
          retention-days: 30
