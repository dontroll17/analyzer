<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stream Sensation Analyzer</title>
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 15px 0;
      font-size: 14px;
      text-align: center;
      color: #333;
    }
    button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.2s;
    }
    #startBtn { background: #4CAF50; color: white; }
    #startBtn:hover { background: #45a049; }
    #startBtn:disabled { background: #ccc; cursor: not-allowed; }
    
    #stopBtn { background: #f44336; color: white; }
    #stopBtn:hover { background: #da190b; }
    #stopBtn:disabled { background: #ccc; cursor: not-allowed; }

    #status {
      margin-top: 15px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
    }
    .connected { background: #e8f5e9; color: #2e7d32; border: 1px solid #4CAF50; }
    .disconnected { background: #ffebee; color: #c62828; border: 1px solid #f44336; }
  </style>
</head>
<body>
  <h3>Stream Sensation Analyzer</h3>
  <button id="startBtn">Start Capture</button>
  <button id="stopBtn" disabled>Stop Capture</button>
  <div id="status" class="disconnected">Not Connected</div>
  
  <!-- RMS Display Section -->
  <div id="rmsSection" style="margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px; display: none;">
    <div style="font-size: 11px; color: #666; margin-bottom: 8px;">Current RMS:</div>
    <div id="rmsValue" style="font-size: 18px; font-weight: bold; color: #333;">0.0000</div>
    <div id="rmsLevel" style="font-size: 10px; color: #888; margin-bottom: 10px;">Level: --</div>
    
    <div style="margin-bottom: 10px;">
      <div id="rmsBarContainer" style="width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden;">
        <div id="rmsBar" style="width: 0%; height: 100%; background: #4CAF50; transition: width 0.15s ease-out, background-color 0.3s ease;"></div>
      </div>
    </div>
    
    <!-- Frequency Bands Section -->
    <div id="freqBandsSection" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; display: none;">
      <div style="font-size: 11px; color: #666; margin-bottom: 8px;">Frequency Bands:</div>
      
      <!-- Bass Band -->
      <div style="margin-bottom: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 9px; color: #777;">
          <span>Bass (0-220Hz)</span>
          <span id="bassValue">0%</span>
        </div>
        <div style="width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden;">
          <div id="bassBar" style="width: 0%; height: 100%; background: #2196F3; transition: width 0.05s ease-out;"></div>
        </div>
      </div>
      
      <!-- Mid Band -->
      <div style="margin-bottom: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 9px; color: #777;">
          <span>Mid (220-4400Hz)</span>
          <span id="midValue">0%</span>
        </div>
        <div style="width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden;">
          <div id="midBar" style="width: 0%; height: 100%; background: #4CAF50; transition: width 0.05s ease-out;"></div>
        </div>
      </div>
      
      <!-- Treble Band -->
      <div style="margin-bottom: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 9px; color: #777;">
          <span>Treble (4.4-22kHz)</span>
          <span id="trebleValue">0%</span>
        </div>
        <div style="width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden;">
          <div id="trebleBar" style="width: 0%; height: 100%; background: #FF9800; transition: width 0.05s ease-out;"></div>
        </div>
      </div>
      
      <!-- Glitch Detector Status Badge -->
      <div id="glitchSection" style="margin-top: 10px; padding: 8px; border-radius: 4px; background: #1e1e1e; color: #fff; display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
        <div>
          Status: <span id="glitchStatus" style="font-weight: bold; color: #4CAF50;">STABLE</span>
        </div>
        <div>
          Glitches: <span id="glitchCount" style="font-weight: bold; color: #fff;">0</span>
        </div>
      </div>

      <!-- Oscilloscope Section -->
      <div id="oscilloscopeSection" style="margin-top: 15px; padding: 10px; background: #222; border-radius: 4px; display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <div style="font-size: 11px; color: #aaa;">Oscilloscope (Real-time Waveform)</div>
          <button id="exportBtn" style="width: auto; margin: 0; padding: 4px 8px; font-size: 10px; background: #2196F3; color: white;">
            📥 Export
          </button>
        </div>
        
        <canvas id="oscilloscopeCanvas" width="260" height="150" style="width: 100%; height: 150px; background: #1a1a1a; border-radius: 2px; border: 1px solid #444;"></canvas>
        
        <div style="display: flex; justify-content: space-between; font-size: 9px; color: #888; margin-top: 5px;">
          <span>Left Channel (Blue)</span>
          <span>Right Channel (Red)</span>
        </div>
      </div> <!-- ✅ Закрыт oscilloscopeSection -->
    </div> <!-- ✅ Закрыт freqBandsSection -->
  </div> <!-- ✅ Закрыт rmsSection -->
  
  <script type="module" src="popup.js"></script>
</body>
</html>
