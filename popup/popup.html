<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stream Sensation Analyzer</title>
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 15px 0;
      font-size: 14px;
      text-align: center;
      color: #333;
    }
    button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.2s;
    }
    #startBtn {
      background: #4CAF50;
      color: white;
    }
    #startBtn:hover {
      background: #45a049;
    }
    #startBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #stopBtn {
      background: #f44336;
      color: white;
    }
    #stopBtn:hover {
      background: #da190b;
    }
    #stopBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
    }
    .connected {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4CAF50;
    }
    .disconnected {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }
  </style>
</head>
<body>
  <h3>Stream Sensation Analyzer</h3>
  <button id="startBtn">Start Capture</button>
  <button id="stopBtn" disabled>Stop Capture</button>
  <div id="status" class="disconnected">Not Connected</div>
  
  <!-- RMS Display Section -->
  <div id="rmsSection" style="margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px; display: none;">
    <div style="font-size: 11px; color: #666; margin-bottom: 5px;">Current RMS:</div>
    <div id="rmsValue" style="font-size: 18px; font-weight: bold; color: #333;">0.0000</div>
    <div id="rmsLevel" style="font-size: 10px; color: #888;">Level: --</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
