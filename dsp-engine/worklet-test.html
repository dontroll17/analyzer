<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioWorklet Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 {
      color: #4CAF50;
    }
    .status {
      padding: 15px;
      margin: 20px 0;
      border-radius: 5px;
      font-weight: bold;
    }
    .status.success {
      background: #2e7d32;
      color: white;
    }
    .status.error {
      background: #c62828;
      color: white;
    }
    #console {
      background: #000;
      padding: 15px;
      margin: 20px 0;
      border-radius: 5px;
      min-height: 200px;
      font-family: monospace;
      overflow-y: auto;
      max-height: 400px;
    }
    .log {
      margin: 5px 0;
      padding: 5px;
      border-left: 3px solid #4CAF50;
      padding-left: 10px;
    }
    .log.error {
      border-left-color: #c62828;
    }
    .log.debug {
      border-left-color: #2196F3;
      color: #aaa;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      margin: 5px;
    }
    #startBtn {
      background: #4CAF50;
      color: white;
    }
    #startBtn:hover {
      background: #45a049;
    }
    #startBtn:disabled {
      background: #666;
      cursor: not-allowed;
    }
    #testAudioBtn {
      background: #2196F3;
      color: white;
    }
    #testAudioBtn:hover {
      background: #1976D2;
    }
    #testAudioBtn:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>AudioWorklet Test</h1>
  
  <div id="status" class="status">Ready to test</div>
  
  <button id="startBtn">Start AudioContext & Load Worklet</button>
  <button id="testAudioBtn">Test Audio Generation</button>
  
  <div id="console"></div>
  
  <script>
    // Console logging helper
    function log(message, type = 'info') {
      const consoleDiv = document.getElementById('console');
      const logDiv = document.createElement('div');
      logDiv.className = 'log ' + type;
      const timestamp = new Date().toISOString();
      logDiv.textContent = `[${timestamp}] ${message}`;
      consoleDiv.appendChild(logDiv);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }
    
    // Update status display
    function updateStatus(message, success) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = message;
      statusDiv.className = 'status ' + (success ? 'success' : 'error');
    }
    
    // Test AudioWorklet loading
    async function testAudioWorklet() {
      try {
        log('Starting AudioWorklet test...', 'info');
        updateStatus('Initializing AudioContext...', false);
        
        // Create AudioContext
        const audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 44100
        });
        
        log('AudioContext created with sampleRate: ' + audioContext.sampleRate, 'debug');
        
        // Register AudioWorklet
        const workletPath = chrome.runtime.getURL('dsp-engine/audio-worklet.js');
        log('Worklet path: ' + workletPath, 'debug');
        
        updateStatus('Loading AudioWorklet module...', false);
        
        await audioContext.audioWorklet.addModule(workletPath);
        
        log('AudioWorklet module loaded successfully!', 'success');
        updateStatus('AudioWorklet loaded successfully!', true);
        
        // Store sample rate for worklet access
        globalThis.workletSampleRate = audioContext.sampleRate;
        log('Stored sample rate in globalThis.workletSampleRate: ' + globalThis.workletSampleRate, 'debug');
        
        // Create AudioWorkletNode
        updateStatus('Creating AudioWorkletNode...', false);
        
        const workletNode = new AudioWorkletNode(audioContext, 'audio-analyzer', {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          channelCount: 1,
          channelCountMode: 'explicit',
          channelInterpretation: 'discrete'
        });
        
        log('AudioWorkletNode created successfully!', 'success');
        
        // Listen for messages from worklet
        workletNode.port.onmessage = (event) => {
          const data = event.data;
          log('Received from worklet: ' + JSON.stringify(data), 'debug');
          
          if (data.type === 'METRICS') {
            log('Frequency bands: Bass=' + data.bass.toFixed(2) + '%, Mid=' + data.mid.toFixed(2) + '%, Treble=' + data.treble.toFixed(2) + '%', 'success');
          } else if (data.type === 'DEBUG') {
            log('Worklet debug: ' + data.message, 'debug');
          }
        };
        
        workletNode.port.onmessageerror = (event) => {
          log('Error receiving message from worklet: ' + JSON.stringify(event), 'error');
        };
        
        workletNode.port.onerror = (error) => {
          log('Worklet port error: ' + error.message, 'error');
        };
        
        // Connect to destination to generate some audio
        updateStatus('Connecting to destination (will generate test tone)...', false);
        
        // Create oscillator for test audio
        const oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, audioContext.currentTime); // A4 note
        oscillator.connect(workletNode);
        workletNode.connect(audioContext.destination);
        
        oscillator.start();
        log('Test oscillator started (440Hz sine wave)', 'success');
        
        // Stop after 3 seconds
        setTimeout(() => {
          oscillator.stop();
          log('Test oscillator stopped', 'info');
        }, 3000);
        
        // Update status
        updateStatus('AudioWorklet test completed successfully!', true);
        
      } catch (error) {
        log('Error: ' + error.message, 'error');
        log('Stack: ' + error.stack, 'error');
        updateStatus('Error: ' + error.message, false);
      }
    }
    
    // Test audio generation without worklet
    async function testAudioGeneration() {
      try {
        log('Starting audio generation test...', 'info');
        
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        const oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
        oscillator.connect(audioContext.destination);
        oscillator.start();
        
        log('Test tone started (440Hz sine wave)', 'success');
        
        setTimeout(() => {
          oscillator.stop();
          log('Test tone stopped', 'info');
        }, 2000);
        
      } catch (error) {
        log('Audio generation error: ' + error.message, 'error');
      }
    }
    
    // Event listeners
    document.getElementById('startBtn').addEventListener('click', testAudioWorklet);
    document.getElementById('testAudioBtn').addEventListener('click', testAudioGeneration);
    
    // Initial log
    log('AudioWorklet test page loaded', 'info');
  </script>
</body>
</html>
